<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOWINGS PERÚ | Mariposas Luminosas para Eventos</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #25d366;
      --primary-hover: #1ebd56;
      --gold-accent: #ffe066;
      --card-bg: rgba(15, 23, 42, 0.75);
      --text-main: #ffffff;
      --text-muted: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* === EFECTO DE BRILLO EN EL PUNTERO === */
    .mouse-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 224, 102, 0.3) 0%, rgba(255, 224, 102, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.04s ease-out;
      z-index: 9999;
      mix-blend-mode: screen;
    }

    /* === VIDEO DE FONDO === */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }

    .video-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
      z-index: -1;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      z-index: 1;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 1rem 0 1.5rem;
      position: relative;
    }

    /* === MARIPOSA LUMINOSA (Aleteo suave + Brillo neón sin marco) === */
    .magic-butterfly {
      position: absolute;
      top: clamp(0.5rem, 3vw, 1.4rem);
      left: clamp(0.25rem, 5vw, 2.5rem);
      width: clamp(50px, 7vw, 80px);
      height: clamp(50px, 7vw, 80px);
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 0 15px rgba(0, 191, 255, 0.85)) drop-shadow(0 0 30px rgba(0, 191, 255, 0.45));
      animation: butterflyFloat 6s ease-in-out infinite;
    }

    .magic-butterfly .wing-left {
      transform-origin: 50px 55px;
      animation: flapLeft 2.2s ease-in-out infinite;
    }

    .magic-butterfly .wing-right {
      transform-origin: 50px 55px;
      animation: flapRight 2.2s ease-in-out infinite;
    }

    @keyframes flapLeft {
      0%, 100% { transform: scaleX(1) rotate(0deg); }
      50%      { transform: scaleX(0.3) rotate(12deg); }
    }

    @keyframes flapRight {
      0%, 100% { transform: scaleX(1) rotate(0deg); }
      50%      { transform: scaleX(0.3) rotate(-12deg); }
    }

    @keyframes butterflyFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-15px) rotate(3deg); }
    }

    /* === RAMIFICACIÓN MÁGICA DORADA (fondo, crece desde las bases laterales) === */
    .magic-vine {
      position: fixed;
      bottom: 0;
      width: min(46vw, 480px);
      height: min(60vh, 620px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.9;
    }

    .magic-vine.left { left: 0; }
    .magic-vine.right { right: 0; transform: scaleX(-1); }

    .magic-vine svg { width: 100%; height: 100%; overflow: visible; }

    .vine-path {
      fill: none;
      stroke: url(#vineGoldGradient);
      stroke-width: 2.4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(255, 224, 102, 0.65));
      stroke-dasharray: 100;
      animation: vineGrow 7s ease-in-out infinite;
    }

    .vine-path.tendril-1 { animation-delay: 0.6s; stroke-width: 1.6; }
    .vine-path.tendril-2 { animation-delay: 1.4s; stroke-width: 1.6; }
    .vine-path.tendril-3 { animation-delay: 2.1s; stroke-width: 1.3; }

    @keyframes vineGrow {
      0%   { stroke-dashoffset: 100; opacity: 0; }
      12%  { opacity: 1; }
      55%  { stroke-dashoffset: 0; opacity: 1; }
      82%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -100; opacity: 0; }
    }

    .vine-spark {
      fill: var(--gold-accent);
      filter: drop-shadow(0 0 4px rgba(255, 224, 102, 0.9));
      animation: sparklePulse 2.4s ease-in-out infinite;
    }

    @keyframes sparklePulse {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50%      { opacity: 1; transform: scale(1); }
    }

    /* === TITULO PRINCIPAL === */
    .brand-title {
      font-size: clamp(4.5rem, 18vw, 11rem);
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--gold-accent);
      text-transform: uppercase;
      line-height: 0.9;
      margin-bottom: 0.5rem;
      text-shadow: 
        0 0 20px rgba(255, 224, 102, 0.8),
        0 0 40px rgba(255, 224, 102, 0.5),
        0 0 80px rgba(255, 224, 102, 0.3),
        0 5px 15px rgba(0,0,0,0.9);
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
    }

    .brand-subtitle {
      font-size: clamp(1.2rem, 3.5vw, 2rem);
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 2rem;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .hero h1 {
      font-size: 1.8rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 1rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 680px;
      margin: 0 auto 2rem;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* Botón de WhatsApp */
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background-color: var(--primary-color);
      color: #ffffff;
      padding: 1.2rem 2.5rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.25rem;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
      transition: all 0.3s ease;
    }

    .btn-whatsapp:hover {
      background-color: var(--primary-hover);
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 40px rgba(37, 211, 102, 0.8);
    }

    /* Tarjetas de Servicios / Video */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      margin-top: 2.5rem;
    }

    @media (max-width: 560px) {
      .services-grid {
        grid-template-columns: 1fr;
      }
    }

    .service-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 224, 102, 0.3);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .service-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold-accent);
      box-shadow: 0 10px 30px rgba(255, 224, 102, 0.25);
    }

    .card-video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: rgba(0, 0, 0, 0.4);
      overflow: hidden;
      position: relative;
    }

    .card-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Elemento para el brillo en el puntero -->
  <div class="mouse-glow" id="mouseGlow"></div>

  <!-- Video de Fondo -->
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="video.mp4" type="video/mp4">
      Tu navegador no soporta la reproducción del video.
    </video>
  </div>

  <div class="video-overlay"></div>

  <!-- Ramificación mágica dorada: crece desde la base izquierda -->
  <div class="magic-vine left" aria-hidden="true">
    <svg viewBox="0 0 400 500" preserveAspectRatio="xMinYMax meet">
      <defs>

      <path class="vine-path main" pathLength="100" style="stroke:url(#vineGoldGradient2)"

      <path class="vine-path tendril-1" pathLength="100" style="stroke:url(#vineGoldGradient2)"

      <path class="vine-path tendril-3" pathLength="100" style="stroke:url(#vineGoldGradient2)"

      <circle class="vine-spark" cx="150" cy="315" r="3.2" style="animation-delay:0.8s"/>
      <circle class="vine-spark" cx="175" cy="163" r="2.6" style="animation-delay:1.7s"/>
      <circle class="vine-spark" cx="176" cy="39" r="2.8" style="animation-delay:2.4s"/>
      <circle class="vine-spark" cx="95" cy="330" r="2.2" style="animation-delay:0.3s"/>
    </svg>
  </div>

  <!-- Contenido Principal -->

          <!-- Ala Izquierda -->
          <g class="wing-left">

          <!-- Cuerpo -->
          <ellipse cx="50" cy="56" rx="2.5" ry="15" fill="#e0f7fc"/>

          <path d="M48 37 C 43 28, 38 25, 33 20" stroke="#aae5ff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          <path d="M52 37 C 57 28, 62 25, 67 20" stroke="#aae5ff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- TITULO PRINCIPAL -->
      <h1 class="brand-title">GLOWINGS PERÚ</h1>
      <p class="brand-subtitle">Mariposas Luminosas para Eventos</p>
      
      <h1>La mariposa luminosa que sorprende a todos 🦋✨</h1>
      <p>Vuela con control remoto. El detalle mágico e inolvidable para bodas, cumpleaños y celebraciones especiales.</p>
      
      <a href="https://api.whatsapp.com/send?phone=51933029804&text=Hola%2C%20quisiera%20cotizar%20las%20mariposas%20luminosas%20para%20un%20evento" 
         target="_blank" 
         rel="noopener"
         class="btn-whatsapp">
        <i class="fa-brands fa-whatsapp fa-xl"></i>
        Cotizar por WhatsApp
      </a>
    </section>

    <!-- Tablillas de video -->
    <section class="services-grid">
      <div class="service-card">
        <div class="card-video-wrapper">
          <video autoplay muted loop playsinline poster="assets/poster-1.jpg">
            <source src="videos/video-1.mp4" type="video/mp4">
          </video>
        </div>
      </div>

      <div class="service-card">
        <div class="card-video-wrapper">
          <video autoplay muted loop playsinline poster="assets/poster-2.jpg">
            <source src="videos/video-2.mp4" type="video/mp4">
          </video>
        </div>
      </div>

      <div class="service-card">
        <div class="card-video-wrapper">
          <video autoplay muted loop playsinline poster="assets/poster-3.jpg">
            <source src="videos/video-3.mp4" type="video/mp4">
          </video>
        </div>
      </div>

      <div class="service-card">
        <div class="card-video-wrapper">
          <video autoplay muted loop playsinline poster="assets/poster-4.jpg">
            <source src="videos/video-4.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 GLOWINGS PERÚ. Todos los derechos reservados.</p>
  </footer>

  <!-- Script para el movimiento del brillo del puntero -->
  <script>
    const glow = document.getElementById('mouseGlow');

    document.addEventListener('mousemove', (e) => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });
  </script>

</body>
</html>
